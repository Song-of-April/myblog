<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宋佳芯的博客</title>
    <style>
        /* 极简风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fafafa;
            color: #333;
            line-height: 1.8;
            padding: 40px 20px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #111;
        }

        header p {
            color: #666;
            font-size: 1rem;
            margin-top: 8px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 24px;
            margin: 32px 0;
            padding: 24px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0070f3, #00a8ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
            font-weight: 600;
            flex-shrink: 0;
        }

        .info h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #222;
        }

        .info .tag {
            display: inline-block;
            font-size: 0.8rem;
            color: #0070f3;
            background: #e8f4fd;
            padding: 2px 10px;
            border-radius: 12px;
            margin-top: 4px;
        }

        .info ul {
            list-style: none;
            margin-top: 8px;
            font-size: 0.9rem;
            color: #555;
        }

        .info ul li {
            display: inline;
        }

        .info ul li:not(:last-child)::after {
            content: " · ";
            color: #ccc;
        }

        .divider {
            border: none;
            border-top: 1px solid #eaeaea;
            margin: 30px 0;
        }

        .post {
            margin-bottom: 48px;
        }

        .post h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #222;
        }

        .post h2 a {
            color: inherit;
            text-decoration: none;
        }

        .post h2 a:hover {
            color: #0070f3;
        }

        .post .meta {
            font-size: 0.85rem;
            color: #999;
            margin-top: 4px;
        }

        .post p {
            margin-top: 10px;
            color: #555;
        }

        footer {
            margin-top: 80px;
            padding-top: 20px;
            border-top: 1px solid #eaeaea;
            font-size: 0.85rem;
            color: #999;
            text-align: center;
        }

        footer a {
            color: #666;
            text-decoration: none;
        }

        footer a:hover {
            color: #0070f3;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>宋佳芯的博客</h1>
            <p>记录思考，分享生活</p>
        </header>

        <!-- 个人简介卡片 -->
        <div class="profile">
            <div class="avatar">宋</div>
            <div class="info">
                <h2>宋佳芯</h2>
                <span class="tag">中国科学技术大学 · 计算机科学与技术</span>
                <ul>
                    <li>🏸 羽毛球</li>
                    <li>🎻 小提琴</li>
                    <li>✈️ 旅行</li>
                </ul>
            </div>
        </div>

        <hr class="divider">

        <main>
            <article class="post">
                <h2><a href="#">Hello World</a></h2>
                <div class="meta">2026 年 5 月 12 日</div>
                <p>这是我的第一篇博客文章。欢迎来到我的个人博客，这里将记录我的学习笔记、项目心得和生活感悟。</p>
            </article>

            <article class="post">
                <h2><a href="#">关于这个博客</a></h2>
                <div class="meta">2026 年 5 月 12 日</div>
                <p>这个博客使用纯 HTML + CSS 构建，托管在 GitHub Pages 上。极简、轻量、专注于内容本身。</p>
            </article>
        </main>

        <footer>
            <p>&copy; 2026 <a href="https://github.com">宋佳芯的博客</a>. Powered by GitHub Pages.</p>
        </footer>
    </div>
</body>

</html>
