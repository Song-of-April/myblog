<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宋佳芯的个人主页</title>
    <style>
        /* 极简风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fafafa;
            color: #333;
            line-height: 1.8;
            padding: 40px 20px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #111;
        }

        header p {
            color: #666;
            font-size: 1rem;
            margin-top: 8px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 24px;
            margin: 32px 0;
            padding: 24px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0070f3, #00a8ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
            font-weight: 600;
            flex-shrink: 0;
        }

        .info h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #222;
        }

        .info .tag {
            display: inline-block;
            font-size: 0.8rem;
            color: #0070f3;
            background: #e8f4fd;
            padding: 2px 10px;
            border-radius: 12px;
            margin-top: 4px;
        }

        .info ul {
            list-style: none;
            margin-top: 8px;
            font-size: 0.9rem;
            color: #555;
        }

        .info ul li {
            display: inline;
        }

        .info ul li:not(:last-child)::after {
            content: " · ";
            color: #ccc;
        }

        .divider {
            border: none;
            border-top: 1px solid #eaeaea;
            margin: 30px 0;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 16px;
        }

        .hobby-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 40px;
        }

        .hobby-tag {
            display: inline-block;
            font-size: 0.9rem;
            color: #555;
            background: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #eaeaea;
            transition: all 0.2s;
        }

        .hobby-tag:hover {
            border-color: #0070f3;
            color: #0070f3;
        }

        .project-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
            transition: box-shadow 0.2s;
        }

        .project-card:hover {
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .project-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #222;
        }

        .project-card h3 a {
            color: inherit;
            text-decoration: none;
        }

        .project-card h3 a:hover {
            color: #0070f3;
        }

        .project-card p {
            font-size: 0.9rem;
            color: #666;
            margin-top: 6px;
        }

        .project-card .project-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #0070f3;
            text-decoration: none;
        }

        .project-card .project-link:hover {
            text-decoration: underline;
        }

        .coming-soon {
            font-size: 0.85rem;
            color: #999;
            font-style: italic;
        }

        footer {
            margin-top: 80px;
            padding-top: 20px;
            border-top: 1px solid #eaeaea;
            font-size: 0.85rem;
            color: #999;
            text-align: center;
        }

        footer a {
            color: #666;
            text-decoration: none;
        }

        footer a:hover {
            color: #0070f3;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>宋佳芯的个人主页</h1>
            <p>中国科学技术大学 · 计算机科学与技术</p>
        </header>

        <!-- 个人简介卡片 -->
        <div class="profile">
            <div class="avatar">宋</div>
            <div class="info">
                <h2>宋佳芯</h2>
                <span class="tag">计算机科学与技术</span>
                <ul>
                    <li>🏸 羽毛球</li>
                    <li>🎻 小提琴</li>
                    <li>✈️ 旅行</li>
                </ul>
            </div>
        </div>

        <hr class="divider">

        <!-- 兴趣 -->
        <h2 class="section-title">🎯 兴趣</h2>
        <div class="hobby-list">
            <span class="hobby-tag">🎵 二胡</span>
            <span class="hobby-tag">🏸 羽毛球</span>
            <span class="hobby-tag">🎻 小提琴</span>
            <span class="hobby-tag">✈️ 旅行</span>
            <span class="hobby-tag">🎸 吉他</span>
        </div>

        <!-- 作品集 -->
        <h2 class="section-title">💻 作品集</h2>

        <div class="project-card">
            <h3><a href="https://6a02ee6533245867fcb48381--phenomenal-pithivier-c2007b.netlify.app/"
                    target="_blank">个人主页</a></h3>
            <p>我的第一个个人主页项目，使用 AI + Agent 完成。</p>
            <a class="project-link" href="https://6a02ee6533245867fcb48381--phenomenal-pithivier-c2007b.netlify.app/"
                target="_blank">查看项目 →</a>
        </div>

        <div class="project-card">
            <h3><a href="https://chess.aprilsong.top/" target="_blank">双人回合制棋盘游戏</a></h3>
            <p>高度可配置的双人对战棋盘游戏，支持自定义棋盘大小、棋子种类、移动规则和多种连线胜利条件。</p>
            <a class="project-link" href="https://chess.aprilsong.top/" target="_blank">开始游戏 →</a>
        </div>

        <div class="project-card">
            <h3>更多作品</h3>
            <p class="coming-soon">后续会更新更多作品，敬请期待 ✨</p>
        </div>

        <footer>
            <p>&copy; 2026 宋佳芯的个人主页. Powered by GitHub Pages.</p>
        </footer>
    </div>
</body>

</html>
